name: 每日刷新灵感画廊

on:
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = 北京时间 04:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取 + 重建灵感画廊分片
        env:
          SRC_BASE: ${{ secrets.SRC_BASE }}
          SRC_AES_KEY: ${{ secrets.SRC_AES_KEY }}
          SRC_PHONE: ${{ secrets.SRC_PHONE }}
          SRC_PASS: ${{ secrets.SRC_PASS }}
          SRC_BANNED: ${{ secrets.SRC_BANNED }}
          IMG_HOST_I: ${{ secrets.IMG_HOST_I }}
          IMG_HOST_Q: ${{ secrets.IMG_HOST_Q }}
          IMG_HOST_V: ${{ secrets.IMG_HOST_V }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          YC_TOKEN_FILE: ${{ github.workspace }}/.cache/token.txt
        run: python tools/refresh.py
      - name: 刷新热门视频分片
        continue-on-error: true
        env:
          SRC_BASE: ${{ secrets.SRC_BASE }}
          SRC_AES_KEY: ${{ secrets.SRC_AES_KEY }}
          SRC_PHONE: ${{ secrets.SRC_PHONE }}
          SRC_PASS: ${{ secrets.SRC_PASS }}
          SRC_BANNED: ${{ secrets.SRC_BANNED }}
          IMG_HOST_I: ${{ secrets.IMG_HOST_I }}
          IMG_HOST_Q: ${{ secrets.IMG_HOST_Q }}
          IMG_HOST_V: ${{ secrets.IMG_HOST_V }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          YC_TOKEN_FILE: ${{ github.workspace }}/.cache/token.txt
        run: |
          python tools/fetch_hotvideo.py
          python tools/build_hotvideo.py
      - name: 兜底修复畸形参考图路径
        continue-on-error: true
        run: python tools/fix_refs.py data
      - name: 刷新开放精选(图/视频)
        continue-on-error: true
        env:
          OI_API: ${{ secrets.OI_API }}
          OI_PAGES: '20'
          # 源图床主机(数据里会写成完整直连地址, 需要这个 Secret)
          IMG_HOST_O: ${{ secrets.IMG_HOST_O }}
        run: |
          python tools/fetch_openimg.py
          python tools/build_oi.py
      - name: 刷新外部灵感库(图/视频/Vibe Coding)
        continue-on-error: true
        env:
          # 该图库地址走 Secret, 不落仓库
          WF_API: ${{ secrets.WF_API }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          # 每晚抓取量上限(实测 1.6s/页 + 详情 2.5s/条, 太大会跑超时)
          WF_IMG_CAP: '400'
          WF_VID_CAP: '250'
          WF_VIBE_CAP: '150'
          WF_PROMPT_CAP: '80'
          WF_PAGE: '30'
        run: |
          python tools/fetch_wf.py
          python tools/build_wf.py
      - name: 刷新海螺 H3 视频案例(独立页签)
        continue-on-error: true
        env:
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          # 案例源(公开 MIT 库, 全部自托管可播)与媒体基址均可用环境变量覆盖
          H3_BASE: ${{ secrets.H3_BASE }}
          H3_CAP: '3000'
          H3_PROMPT_CAP: '900'
        run: |
          python tools/fetch_h3.py
          python tools/build_h3.py
      - name: 重建分类首屏包
        # 灵感画廊的数据切成 600 条/片, 点一个分类要把 95 个分片全拉一遍才知道
        # 哪些条目属于它。这里按分类各切一个 120 条的首屏包(cp_*.json), 前端点
        # 分类先拉这个单文件, 1~2 秒就有图, 剩下的再按分片渐进补。
        run: |
          python tools/build_catpack.py data
      - name: 同步 data 版本号(缓存击穿)
        # GitHub Pages 是 max-age=600: 数据刷新后旧 manifest 会在 CDN 残留最多
        # 10 分钟, 期间用户可能拿到缺 wf 数据的旧版。这里把 manifest 的内容哈希
        # 写进 config.js 的 DATA_VER 并刷新 index.html 对 config.js 的 ?v=,
        # 让浏览器必然拉到新分片。
        run: |
          python - <<'EOF'
          import hashlib, re
          ver = hashlib.md5(open('data/manifest.json','rb').read()).hexdigest()[:8]
          p = 'assets/js/config.js'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r"DATA_VER: '[^']*'", "DATA_VER: '%s'" % ver, s)
          open(p, 'w', encoding='utf-8').write(s2)
          h = hashlib.md5(open(p,'rb').read()).hexdigest()[:8]
          t = open('index.html', encoding='utf-8').read()
          t = re.sub(r"assets/js/config\.js(\?v=[0-9a-f]+)?", "assets/js/config.js?v=" + h, t)
          open('index.html', 'w', encoding='utf-8').write(t)
          print('DATA_VER =', ver, '| config.js?v=' + h)
          EOF
      - name: 提交改动
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 每日刷新灵感画廊数据"
            git push
          fi
