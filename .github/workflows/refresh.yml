name: 每日刷新灵感画廊

on:
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = 北京时间 04:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取 + 重建灵感画廊分片
        env:
          SRC_BASE: ${{ secrets.SRC_BASE }}
          SRC_AES_KEY: ${{ secrets.SRC_AES_KEY }}
          SRC_PHONE: ${{ secrets.SRC_PHONE }}
          SRC_PASS: ${{ secrets.SRC_PASS }}
          SRC_BANNED: ${{ secrets.SRC_BANNED }}
          IMG_HOST_I: ${{ secrets.IMG_HOST_I }}
          IMG_HOST_Q: ${{ secrets.IMG_HOST_Q }}
          IMG_HOST_V: ${{ secrets.IMG_HOST_V }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          YC_TOKEN_FILE: ${{ github.workspace }}/.cache/token.txt
        run: python tools/refresh.py
      - name: 刷新热门视频分片
        continue-on-error: true
        env:
          SRC_BASE: ${{ secrets.SRC_BASE }}
          SRC_AES_KEY: ${{ secrets.SRC_AES_KEY }}
          SRC_PHONE: ${{ secrets.SRC_PHONE }}
          SRC_PASS: ${{ secrets.SRC_PASS }}
          SRC_BANNED: ${{ secrets.SRC_BANNED }}
          IMG_HOST_I: ${{ secrets.IMG_HOST_I }}
          IMG_HOST_Q: ${{ secrets.IMG_HOST_Q }}
          IMG_HOST_V: ${{ secrets.IMG_HOST_V }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          YC_TOKEN_FILE: ${{ github.workspace }}/.cache/token.txt
        run: |
          python tools/fetch_hotvideo.py
          python tools/build_hotvideo.py
      - name: 兜底修复畸形参考图路径
        continue-on-error: true
        run: python tools/fix_refs.py data
      - name: 刷新开放精选(图/视频)
        continue-on-error: true
        env:
          OI_API: ${{ secrets.OI_API }}
          OI_PAGES: '20'
          # 源图床主机(数据里会写成完整直连地址, 需要这个 Secret)
          IMG_HOST_O: ${{ secrets.IMG_HOST_O }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
        run: |
          python tools/fetch_openimg.py
          python tools/build_oi.py
      - name: 刷新外部灵感库(图/视频/Vibe Coding)
        continue-on-error: true
        env:
          # 该图库地址走 Secret, 不落仓库
          WF_API: ${{ secrets.WF_API }}
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          # 每晚抓取量上限(实测 1.6s/页 + 详情 2.5s/条, 太大会跑超时)
          # 2026-10-23: 图库全量 4497 条已按模型分类接入, 上限调到 6000 覆盖全量
          # (否则每晚把接入量打回 400), 详情 prompt 抓 600 条 ≈ 25 分钟。
          WF_IMG_CAP: '6000'
          WF_VID_CAP: '250'
          WF_VIBE_CAP: '150'
          WF_PROMPT_CAP: '600'
          WF_PAGE: '30'
        run: |
          python tools/fetch_wf.py
          python tools/build_wf.py
      - name: 刷新海螺 H3 视频案例(独立页签)
        continue-on-error: true
        env:
          GAL_OUTDIR: ${{ github.workspace }}/data
          GAL_RAW_DIR: ${{ github.workspace }}/.cache
          # 案例源(公开 MIT 库, 全部自托管可播)与媒体基址均可用环境变量覆盖
          H3_BASE: ${{ secrets.H3_BASE }}
          H3_CAP: '3000'
          H3_PROMPT_CAP: '900'
        run: |
          python tools/fetch_h3.py
          python tools/build_h3.py
      - name: 刷新即梦探索页图片(独立分片, 签名直链必须每日重抓)
        # 即梦封面是带签名的临时直链, 不重抓几天后就 403。探索页公开无需 Cookie,
        # 用 Playwright + 运行器预装的 Chrome 拦截 get_explore 接口拿数据。
        # 失败不阻塞每日刷新: 旧分片仍在, reorg 会从分片兜底恢复分类键。
        continue-on-error: true
        env:
          GAL_OUTDIR: ${{ github.workspace }}/data
        run: |
          pip install --quiet playwright
          python tools/fetch_jimeng.py
          python tools/build_jimeng.py
      - name: 同步最新收录三类作品(新作品 + 完整提示词)
        # 这三类的全文要走登录态接口, Cookie 存在仓库 Secret(KOOK_COOKIE)。
        # kook_auth 会自己判断过期并用 KOOK_USER/KOOK_PASS 重新登录，无需人工续期。
        continue-on-error: true
        env:
          KOOK_COOKIE: ${{ secrets.KOOK_COOKIE }}
          KOOK_USER: ${{ secrets.KOOK_USER }}
          KOOK_PASS: ${{ secrets.KOOK_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GAL_OUTDIR: ${{ github.workspace }}/data
        run: |
          pip install --quiet pynacl
          python tools/kook_sync.py
      - name: 重建分类首屏包
        # 灵感画廊的数据切成 600 条/片, 点一个分类要把 95 个分片全拉一遍才知道
        # 哪些条目属于它。这里按分类各切一个 120 条的首屏包(cp_*.json), 前端点
        # 分类先拉这个单文件, 1~2 秒就有图, 剩下的再按分片渐进补。
        run: |
          python tools/build_catpack.py data
      - name: 合并 kook 分类键(一次性快照, 必须在 build_catpack 之后)
        # 这批是一次性快照(525 张自托管图), 没有抓取脚本; refresh.py 会整体
        # 重置 galCats/catCounts.gal, build_catpack 会整体覆盖 galCatPack —— 本步把
        # kook 的三个模型分类键(标签/计数/首屏包索引)加回 manifest, 顺带重算
        # totalCats(refresh.py 用纯 gal 的 galCats 算, 会少算 wf+kook 共 9 个)。
        run: |
          python tools/build_kook.py
      - name: 分类重整（GPT 系列合并 + 人像洁净 + 人像总集首屏包）
        # refresh.py 每晚按源站重新打标, 会把 "GPT Image / GPT Image 2 / 2.5 / 2.6" 拆成
        # 一堆小分类, 也会把超现实/合成/二次元的人像塞回「人像写真」。这里再跑一遍重整:
        #   1) GPT 系列全部并成一个 "GPT Image"
        #   2) 人像写真只留写实, 合成艺术 -> 人像人物, 二次元/3D -> 人像动漫
        #   3) 重建所有分类首屏包 + 「人像全部」首屏包(跨全分类的人像池, 给性别筛选用)
        # 放在 build_catpack / build_kook 之后, 保证覆盖它们生成的旧包。
        run: python tools/reorg_cats_v6.py --apply
      - name: 轮播改用最新收录图片 + 文案中性化
        # 必须在 build_oi / build_wf(会重写 oiHero) 和 build_catpack / build_kook 之后
        run: |
          python tools/update_hero.py
      - name: 同步 data 版本号(缓存击穿)
        # GitHub Pages 是 max-age=600: 数据刷新后旧 manifest 会在 CDN 残留最多
        # 10 分钟, 期间用户可能拿到缺 wf 数据的旧版。这里把 manifest 的内容哈希
        # 写进 config.js 的 DATA_VER 并刷新 index.html 对 config.js 的 ?v=,
        # 让浏览器必然拉到新分片。
        run: |
          python - <<'EOF'
          import hashlib, re
          ver = hashlib.md5(open('data/manifest.json','rb').read()).hexdigest()[:8]
          p = 'assets/js/config.js'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r"DATA_VER: '[^']*'", "DATA_VER: '%s'" % ver, s)
          open(p, 'w', encoding='utf-8').write(s2)
          h = hashlib.md5(open(p,'rb').read()).hexdigest()[:8]
          t = open('index.html', encoding='utf-8').read()
          t = re.sub(r"assets/js/config\.js(\?v=[0-9a-f]+)?", "assets/js/config.js?v=" + h, t)
          open('index.html', 'w', encoding='utf-8').write(t)
          print('DATA_VER =', ver, '| config.js?v=' + h)
          EOF
          python tools/bump_assets.py
      - name: 提交改动
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 每日刷新灵感画廊数据"
            git push
          fi
